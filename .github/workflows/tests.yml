name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Get supported upstream source for overlay tests
        run: |
          git clone --filter=blob:none https://github.com/kacper-daftcode/qwentin.git vendor/qwentin
          git -C vendor/qwentin checkout --detach 8a626374912fe1e24649403423c1120ff58d8522
      - name: Run CPU tests
        env:
          QWENTIN_SOURCE: ${{ github.workspace }}/vendor/qwentin
        run: python -m unittest discover -s tests -p 'test_*.py' -v
